<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexa search</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #1d2330;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 15px; margin: 0 0 10px; }

    /* White boxes around each section */
    .card {
      background: #fff;
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    /* Puts things side by side, and wraps them on small screens */
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #c8cdd5;
      border-radius: 6px;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      background: #2457d6;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }

    /* The Debug checkbox next to the Search button */
    .debug-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #5b6475;
      cursor: pointer;
      user-select: none;
    }

    .status { margin-top: 8px; font-size: 14px; color: #5b6475; min-height: 1.2em; }
    .status.error { color: #b42318; }

    /* The two code boxes (filters and query), side by side on wide screens */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid .card { margin-bottom: 0; }   /* the grid gap already spaces them */
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    pre {
      margin: 0;
      padding: 12px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 12.5px;
      overflow: auto;
      max-height: 360px;
    }

    /* Results table; scrolls sideways on a phone instead of breaking the page */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
    th { color: #5b6475; font-weight: 600; }

    .hidden { display: none; }

    /* The snapshot in the results table, with the person's box drawn on top. */
    td { vertical-align: middle; }
    .snap { position: relative; display: block; width: 160px; }
    .snap img { display: block; width: 100%; border-radius: 4px; background: #eef0f3; }
    .snap .box {
      position: absolute;
      border: 2px solid #22c55e;
      box-sizing: border-box;
      pointer-events: none;     /* clicks go to the image link underneath */
    }
  </style>
</head>

<body>
<main>
  <h1>Nexa search</h1>

  <!-- 1. The search box -->
  <div class="card">
    <form id="searchForm" class="row">
      <input id="searchText" type="text" placeholder="e.g. woman in a black top" autocomplete="off">
      <button id="searchBtn" type="submit">Search</button>
      <label class="debug-toggle">
        <input id="debugBox" type="checkbox"> Debug
      </label>
    </form>
    <div id="searchStatus" class="status"></div>
  </div>

  <!-- 2. How the search was understood: LLM filters and the Elasticsearch query.
          Only shown when Debug is ticked. -->
  <div id="details" class="grid hidden">
    <div class="card">
      <h2>Filters from the LLM</h2>
      <pre id="filtersBox"></pre>
    </div>
    <div class="card">
      <h2>Elasticsearch query</h2>
      <pre id="queryBox"></pre>
    </div>
  </div>

  <!-- 3. The matching alerts -->
  <div id="resultsCard" class="card hidden">
    <h2 id="resultsTitle"></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Image</th><th>Time</th><th>Camera</th><th>Gender</th>
            <th>Age group</th><th>Top</th><th>Bottom</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  // Grab the page elements we need once, at the start.
  const searchForm   = document.getElementById("searchForm");
  const searchText   = document.getElementById("searchText");
  const searchBtn    = document.getElementById("searchBtn");
  const debugBox     = document.getElementById("debugBox");
  const searchStatus = document.getElementById("searchStatus");
  const details      = document.getElementById("details");
  const filtersBox   = document.getElementById("filtersBox");
  const queryBox     = document.getElementById("queryBox");
  const resultsCard  = document.getElementById("resultsCard");
  const resultsTitle = document.getElementById("resultsTitle");
  const resultsBody  = document.getElementById("resultsBody");

  // Sends JSON to our backend and returns its JSON answer.
  // If the backend answers with an error, we throw it so the caller can show it.
  async function postJSON(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    // Read the answer as text first: when the backend crashes it sends plain
    // text ("Internal Server Error"), not JSON, and response.json() would fail
    // with a confusing "Unexpected token" message.
    const text = await response.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`Server error ${response.status}: ${text.slice(0, 200)} ` +
                      "(the details are in the terminal where uvicorn runs)");
    }
    if (!response.ok) {
      throw new Error(data.detail || "Something went wrong.");
    }
    return data;
  }

  // Shows a message under a button, in red if it's an error.
  function setStatus(element, message, isError) {
    element.textContent = message;
    element.className = isError ? "status error" : "status";
  }

  // ---- "Search" button (or pressing Enter in the box) ----------------------
  searchForm.addEventListener("submit", async (event) => {
    event.preventDefault();                // stop the browser from reloading the page
    const text = searchText.value.trim();
    if (!text) return;

    searchBtn.disabled = true;
    setStatus(searchStatus, "Asking the LLM... (this can take a few seconds on a CPU)");
    try {
      // "debug" tells the backend whether to also send the filters and the
      // Elasticsearch query, or only the text and the results.
      const data = await postJSON("/api/search", {
        text: text,
        debug: debugBox.checked,
      });
      setStatus(searchStatus, "");
      showResults(data);
    } catch (error) {
      setStatus(searchStatus, error.message, true);
    }
    searchBtn.disabled = false;
  });

  // Puts the search answer on the page.
  function showResults(data) {
    // The two "how it was understood" boxes: only when the backend sent them
    // (that is, when Debug was on).
    if (data.filters !== undefined) {
      filtersBox.textContent = JSON.stringify(data.filters, null, 2);
      queryBox.textContent = data.es_query
        ? JSON.stringify(data.es_query, null, 2)
        : "No query was run: nothing searchable was found in your text.";
      details.classList.remove("hidden");
    } else {
      details.classList.add("hidden");
    }

    // Fill the results table.
    // We use textContent (never innerHTML) so values always show as plain text.
    resultsBody.innerHTML = "";
    for (const alert of data.results) {
      const row = document.createElement("tr");
      row.appendChild(imageCell(alert));
      const cells = [
        // The time exactly as stored, no time-zone conversion:
        // "2026-10-21T13:14:17.561+00:00" -> "2026-10-21 13:14:17"
        alert.timestamp ? alert.timestamp.replace("T", " ").slice(0, 19) : null,
        alert.camera_id,
        alert.gender,
        alert.age_group,
        alert.upper_color,
        alert.lower_color,
      ];
      for (const value of cells) {
        const cell = document.createElement("td");
        // A missing value means the CV pipeline was "uncertain".
        cell.textContent = value ?? "—";
        row.appendChild(cell);
      }
      resultsBody.appendChild(row);
    }

    if (data.results.length === 0) {
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 7;
      cell.textContent = "No alerts match this search.";
      row.appendChild(cell);
      resultsBody.appendChild(row);
    }

    resultsTitle.textContent = `Results (${data.results.length})`;
    resultsCard.classList.remove("hidden");
  }

  // The first cell of a result row: the snapshot, with a green box around
  // the person this alert is about. Several alerts can share ONE snapshot
  // (several people in the same frame), so the box shows which one it is.
  // Clicking the image opens it full size in a new tab.
  function imageCell(alert) {
    const cell = document.createElement("td");
    if (!alert.image_url) {
      cell.textContent = "—";
      return cell;
    }

    const link = document.createElement("a");
    link.href = alert.image_url;
    link.target = "_blank";
    link.rel = "noopener";
    link.className = "snap";

    const img = document.createElement("img");
    img.src = alert.image_url;   // the browser loads it straight from SeaweedFS
    img.alt = "snapshot";
    img.loading = "lazy";        // only load images when they scroll into view
    // SeaweedFS not reachable, or the image is missing: say so instead of a broken icon.
    img.onerror = () => { cell.textContent = "image not available"; };
    link.appendChild(img);

    // box = [left, top, right, bottom], each a fraction of the image (0 to 1),
    // so it becomes a percentage of the picture's width and height.
    if (Array.isArray(alert.box) && alert.box.length === 4) {
      const [x1, y1, x2, y2] = alert.box;
      const box = document.createElement("div");
      box.className = "box";
      box.style.left = `${x1 * 100}%`;
      box.style.top = `${y1 * 100}%`;
      box.style.width = `${(x2 - x1) * 100}%`;
      box.style.height = `${(y2 - y1) * 100}%`;
      link.appendChild(box);
    }

    cell.appendChild(link);
    return cell;
  }
</script>
</body>
</html>
